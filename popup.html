<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pula</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #0f0f0f;
      --muted: #606060;
      --line: #e5e5e5;
      --accent: #ff4d4d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --fg: #f1f1f1;
        --muted: #aaaaaa;
        --line: #303030;
      }
    }
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
    }
    .stat b {
      display: block;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .stat small {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
    }
    label input { margin: 2px 0 0; accent-color: var(--accent); }
    label em {
      display: block;
      font-style: normal;
      font-size: 11px;
      color: var(--muted);
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    button {
      background: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <h1>Pula<span>.</span></h1>

  <div class="stats">
    <div class="stat"><b id="stat-ads">0</b><small>anúncios</small></div>
    <div class="stat"><b id="stat-time">0s</b><small>economizados</small></div>
    <div class="stat"><b id="stat-chapters">0</b><small>patrocínios</small></div>
  </div>

  <div id="options"></div>

  <footer>
    <span>vale na hora, sem F5</span>
    <button id="reset">Zerar</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
